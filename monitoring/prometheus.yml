global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "election-leader-cluster"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "app-node-1:8001"
          - "app-node-2:8001"
          - "app-node-3:8001"
        labels:
          group: "election-leader-nodes"
