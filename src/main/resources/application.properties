spring.application.name=Election_Leader
# --- Server configuration ---
server.port=8001

# --- Core adaptive ID generator configuration ---
adaptive.epoch-millis=1780000000000
adaptive.node-id=0
adaptive.strategy=AUTO

# --- Redis configuration (for batch allocation) ---
adaptive.redis.key=adaptive:id:block
adaptive.redis.base-block-size=1024
adaptive.redis.min-block-size=256
adaptive.redis.max-block-size=1048576
adaptive.redis.refill-threshold-ratio=0.2

# --- Spring Redis connection info ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# --- ZooKeeper configuration (for Node Registry & Leader Election) ---
adaptive.zookeeper.enabled=false
adaptive.zookeeper.connect-string=localhost:2181
adaptive.zookeeper.session-timeout-ms=60000
adaptive.zookeeper.connection-timeout-ms=5000
adaptive.zookeeper.base-sleep-time-ms=1000
adaptive.zookeeper.max-retries=3
adaptive.zookeeper.base-path=/election-leader

# --- Actuator & metrics configuration ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
